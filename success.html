<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmed &mdash; Soothe &amp; Drift</title>
  <link rel="icon" type="image/jpeg" href="logo-sm.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-bg-dark: #02050b;
      --color-gold-light: #f6ebd0;
      --color-gold: #e5c07b;
      --color-text-bright: #ffffff;
      --color-text-main: #d1d5db;
      --color-text-muted: #9ca3af;
      --font-serif: 'Cormorant Garamond', serif;
      --font-sans: 'Plus Jakarta Sans', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: radial-gradient(circle at 50% 35%, #0d1b2e 0%, #02050b 75%);
      color: var(--color-text-main);
      font-family: var(--font-sans);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
    }
    .success-card {
      max-width: 560px;
      width: 100%;
      background: rgba(11, 22, 42, 0.72);
      border: 1px solid rgba(229, 192, 123, 0.35);
      border-radius: 28px;
      padding: 3rem 2.25rem;
      text-align: center;
      box-shadow: 0 32px 80px rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(20px);
    }
    .check-circle {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      margin: 0 auto 1.5rem;
      background: rgba(229, 192, 123, 0.14);
      border: 1.5px solid var(--color-gold);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-gold-light);
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(2.1rem, 4vw, 2.8rem);
      font-weight: 400;
      color: var(--color-text-bright);
      margin-bottom: 0.85rem;
    }
    h1 span { color: var(--color-gold); font-style: italic; }
    p {
      font-size: 0.98rem;
      line-height: 1.7;
      color: var(--color-text-main);
      margin-bottom: 1.75rem;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.85rem;
      justify-content: center;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.9rem 1.75rem;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.9rem;
      text-decoration: none;
      transition: all 0.3s ease;
    }
    .btn-gold {
      background: linear-gradient(135deg, var(--color-gold-light) 0%, var(--color-gold) 100%);
      color: #02050b;
    }
    .btn-outline {
      border: 1px solid rgba(229, 192, 123, 0.45);
      color: var(--color-gold-light);
    }
  </style>
</head>
<body>
  <div class="success-card">
    <div class="check-circle">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="20 6 9 17 4 12"></polyline></svg>
    </div>
    <h1>Thank You for <span>Taking a Pause.</span></h1>
    <p>Your Soothe &amp; Drift&trade; order is confirmed! We&rsquo;ll ship your Self-Heating Steam Eye Masks within 1&ndash;2 business days with free shipping. While you wait, explore our calming audio ritual.</p>
    <div class="actions">
      <a href="music.html" class="btn btn-gold">Listen to Soundscapes</a>
      <a href="index.html" class="btn btn-outline">Back to Home</a>
    </div>
  </div>
</body>
</html>
